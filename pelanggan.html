<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Sparepart Megamendung - Belanja Online</title>
    <style>
        :root {
            /* Tema Merah, Hitam & Emas Jawa */
            --bg-main: #0a0505;
            --bg-card: #180a0a;
            --bg-input: #2a1010;
            --text-main: #fcf8f2;
            --text-muted: #d4a373;
            --accent-red: #cc1100;
            --accent-red-bright: #ff2a2a;
            --accent-gold: #e5a93b;
            --border: #4a1515;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', 'Times New Roman', serif; }

        /* Background Utama dengan Motif Batik Megamendung SVG (Merah - Hitam) */
        body { 
            background-color: var(--bg-main); 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80"><path d="M0 40 Q20 20 40 40 Q60 60 80 40 Q100 20 120 40 L120 80 L0 80 Z" fill="%231a0303" opacity="0.6"/><path d="M10 40 Q25 25 40 40 Q55 55 70 40 Q85 25 100 40" fill="none" stroke="%234a0d0d" stroke-width="3"/><path d="M20 40 Q30 30 40 40 Q50 50 60 40 Q70 30 80 40" fill="none" stroke="%23800f0f" stroke-width="2"/><path d="M30 40 Q35 35 40 40 Q45 45 50 40 Q55 35 60 40" fill="none" stroke="%23b31212" stroke-width="1.5"/></svg>');
            background-repeat: repeat;
            color: var(--text-main); 
            padding-bottom: 60px; 
        }

        /* Header Khas Jawa & Batik */
        header {
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(180deg, #1f0505 0%, #120202 100%);
            border-bottom: 2px solid var(--accent-gold);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .logo { 
            font-size: 1.2rem; font-weight: bold; color: var(--accent-gold); 
            text-decoration: none; text-transform: uppercase; letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px #000;
            display: flex; align-items: center; gap: 8px;
        }

        .user-nav { display: flex; align-items: center; gap: 8px; }
        .user-tag { 
            font-size: 0.75rem; color: var(--accent-gold); 
            background: var(--bg-input); padding: 5px 10px; border-radius: 4px; 
            border: 1px solid var(--border); 
        }

        .btn-logout { 
            background: transparent; border: 1px solid var(--accent-red); 
            color: var(--accent-red-bright); padding: 5px 10px; border-radius: 4px; 
            font-size: 0.75rem; cursor: pointer; transition: 0.2s;
        }
        .btn-logout:hover { background: var(--accent-red); color: #fff; }

        .cart-btn {
            background: var(--bg-input); border: 1px solid var(--accent-gold); color: var(--text-main);
            padding: 6px 14px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; 
            display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .cart-badge { 
            background: var(--accent-red); color: #fff; font-weight: bold; 
            padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; 
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

        /* Banner Bertema Rumah Joglo / Ornamen Jawa */
        .hero-banner {
            background: linear-gradient(135deg, #3d0000 0%, #1a0202 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 6px; padding: 24px 16px; margin-bottom: 20px; 
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        .hero-banner::before, .hero-banner::after {
            content: "❖"; color: var(--accent-gold); font-size: 1.5rem;
            position: absolute; top: 10px;
        }
        .hero-banner::before { left: 15px; }
        .hero-banner::after { right: 15px; }

        .hero-banner h2 {
            font-size: 1.3rem; color: var(--accent-gold); letter-spacing: 1px;
            margin-bottom: 6px; text-transform: uppercase;
        }

        /* Filter Kategori */
        .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
        .cat-chip {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
            padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; white-space: nowrap; 
            cursor: pointer; transition: all 0.3s ease;
        }
        .cat-chip.active { 
            background: var(--accent-red); color: #ffffff; font-weight: bold; 
            border-color: var(--accent-gold); box-shadow: 0 0 8px rgba(204, 17, 0, 0.6);
        }

        /* Card Produk Jawa & Batik */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
            position: relative; transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .product-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
        }
        .product-img { 
            width: 100%; height: 130px; object-fit: cover; border-radius: 4px; 
            background: var(--bg-input); margin-bottom: 8px; border: 1px solid var(--border);
        }
        .product-title { font-size: 0.9rem; font-weight: bold; color: var(--text-main); margin-bottom: 4px; line-height: 1.2; }
        .product-cat { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; font-style: italic; }
        .product-price { color: var(--accent-gold); font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; }
        
        .btn-add { 
            background: linear-gradient(180deg, #b30f0f 0%, #7a0000 100%); 
            color: #ffffff; border: 1px solid var(--accent-gold); padding: 8px; 
            border-radius: 4px; font-weight: bold; font-size: 0.8rem; cursor: pointer; 
            width: 100%; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-add:hover { background: var(--accent-red-bright); }

        /* Modal / Pop-up Jawa Style */
        .modal { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.85); z-index: 200; display: flex; 
            justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(5px); 
        }
        .modal-card { 
            background: var(--bg-card); border: 2px solid var(--accent-gold); border-radius: 6px; 
            padding: 20px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }
        .hidden { display: none !important; }

        .preview-img { width: 100%; max-height: 250px; object-fit: contain; background: #000; border-radius: 4px; margin-bottom: 12px; border: 1px solid var(--border); }

        /* Kontrol Kuantitas */
        .qty-control { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; }
        .btn-qty { 
            background: var(--bg-input); border: 1px solid var(--accent-gold); color: var(--text-main); 
            width: 32px; height: 32px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1.1rem; 
        }
        .qty-value { font-size: 1rem; font-weight: bold; min-width: 30px; text-align: center; color: var(--accent-gold); }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .btn-delete-item { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 2px 6px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-main); font-size: 0.85rem; outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent-gold);
        }

        .btn-close { background: var(--accent-red); color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-cancel { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; width: 100%; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>

    <script>
        const activeUser = localStorage.getItem('tp_user_session');
        if (!activeUser) {
            window.location.href = 'index.html';
        }
    </script>

    <header>
        <a href="#" class="logo">꧁ ⚡ Toko Megamendung ꧂</a>
        
        <div class="user-nav">
            <span class="user-tag" id="userDisplay">👤 Guest</span>
            <button class="cart-btn" id="openCartBtn">
                🛒 <span class="cart-badge" id="cartCount">0</span>
            </button>
            <button class="btn-logout" id="btnLogoutUser">Metu (Keluar)</button>
        </div>
    </header>

    <div class="container">
        <div class="hero-banner">
            <h2>Pusat Sparepart & Aksesoris Khas Nusantara</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted); font-style: italic;">Piranti Elektronik Jangkep, Rego Seduluran, Pengiriman Cepat!</p>
        </div>

        <div class="category-scroll" id="catFilter">
            <button class="cat-chip active" onclick="filterCategory('ALL', this)">Sedaya (Semua)</button>
            <button class="cat-chip" onclick="filterCategory('Aksesoris Keyboard', this)">Keyboard</button>
            <button class="cat-chip" onclick="filterCategory('Aksesoris Mouse', this)">Mouse</button>
            <button class="cat-chip" onclick="filterCategory('Audio', this)">Audio</button>
            <button class="cat-chip" onclick="filterCategory('GPU', this)">GPU</button>
            <button class="cat-chip" onclick="filterCategory('CPU', this)">CPU</button>
            <button class="cat-chip" onclick="filterCategory('RAM', this)">RAM</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- MODAL DETAIL PRODUK -->
    <div class="modal hidden" id="productModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
                <h3 style="font-size: 1rem; color: var(--accent-gold);" id="modalProdTitle">Detail Produk</h3>
                <button class="btn-close" onclick="closeProductModal()">✕</button>
            </div>

            <img id="modalProdImg" src="" class="preview-img" alt="Product Image">
            
            <div style="margin-bottom: 10px;">
                <div id="modalProdCat" style="font-size: 0.75rem; color: var(--text-muted);">Kategori</div>
                <div id="modalProdPrice" style="font-size: 1.1rem; color: var(--accent-gold); font-weight: bold; margin-top: 2px;">Rp 0</div>
                <div id="modalProdStock" style="font-size: 0.8rem; color: var(--text-main); margin-top: 4px;">Stok Tersedia: 0</div>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 10px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; text-align: center;">Jumlah ingkang dipun tumbas:</label>
                <div class="qty-control">
                    <button class="btn-qty" onclick="changeQty(-1)">-</button>
                    <span class="qty-value" id="selectedQty">1</span>
                    <button class="btn-qty" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn-cancel" onclick="closeProductModal()">Batal</button>
                <button class="btn-add" id="btnConfirmAddToCart" style="padding: 10px;">+ Tambah Keranjang</button>
            </div>
        </div>
    </div>

    <!-- MODAL KERANJANG & CHECKOUT -->
    <div class="modal hidden" id="cartModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
                <h3 style="font-size: 1rem; color: var(--accent-gold);">Keranjang & Checkout</h3>
                <button class="btn-close" id="closeCartBtn">✕</button>
            </div>

            <div id="cartItemsList" style="margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;"></div>

            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.95rem; margin-bottom: 12px; color: var(--text-main);">
                <span>Total Bayar:</span>
                <span id="cartTotalPrice" style="color: var(--accent-gold);">Rp 0</span>
            </div>

            <form id="checkoutForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Nami Jangkep / Username</label>
                    <input type="text" id="custName" placeholder="Masukkan nama pemesan" required>
                </div>
                <div class="form-group">
                    <label>Alamat Pengiriman</label>
                    <textarea id="custAddress" rows="2" placeholder="Mlebetaken alamat jangkep..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select id="payMethod">
                        <option value="QRIS / E-Wallet">QRIS / E-Wallet</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="COD">COD (Bayar ing Papan)</option>
                    </select>
                </div>
                <button type="button" id="btnCheckout" class="btn-add" style="padding: 10px; margin-top: 8px;">Bayar Sekarang</button>
            </form>
        </div>
    </div>

    <script>
        let dataStok = JSON.parse(localStorage.getItem('tp_stok')) || [];
        let cart = [];
        let selectedProduct = null;
        let currentBuyQty = 1;

        document.getElementById('userDisplay').textContent = `👤 ${activeUser}`;
        if (activeUser !== 'Tamu / Guest') {
            document.getElementById('custName').value = activeUser;
        }

        document.getElementById('btnLogoutUser').addEventListener('click', () => {
            localStorage.removeItem('tp_user_session');
            window.location.href = 'index.html';
        });

        const productGrid = document.getElementById('productGrid');
        const cartModal = document.getElementById('cartModal');
        const productModal = document.getElementById('productModal');

        function renderProducts(filter = 'ALL') {
            dataStok = JSON.parse(localStorage.getItem('tp_stok')) || [];
            
            let filteredData = dataStok;
            if (filter !== 'ALL') {
                filteredData = dataStok.filter(p => p.kategori.toLowerCase().includes(filter.toLowerCase()));
            }

            if (filteredData.length === 0) {
                productGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 20px;">Dereng wonten barang kangge kategori puniki.</div>';
                return;
            }

            productGrid.innerHTML = filteredData.map(p => `
                <div class="product-card">
                    <div>
                        <img src="${p.gambar}" class="product-img" alt="${p.nama}">
                        <div class="product-title">${p.nama}</div>
                        <div class="product-cat">${p.kategori} | Stok: ${p.stok}</div>
                    </div>
                    <div>
                        <div class="product-price">Rp ${p.harga.toLocaleString('id-ID')}</div>
                        <button class="btn-add" onclick="openProductModal(${p.id})">+ Keranjang</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts(cat);
        }

        function openProductModal(id) {
            selectedProduct = dataStok.find(p => p.id === id);
            if (!selectedProduct || selectedProduct.stok <= 0) {
                alert('Ngapura, stok barang taksih selak kosong!');
                return;
            }

            currentBuyQty = 1;
            document.getElementById('modalProdTitle').textContent = selectedProduct.nama;
            document.getElementById('modalProdImg').src = selectedProduct.gambar;
            document.getElementById('modalProdCat').textContent = `Kategori: ${selectedProduct.kategori}`;
            document.getElementById('modalProdPrice').textContent = `Rp ${selectedProduct.harga.toLocaleString('id-ID')}`;
            document.getElementById('modalProdStock').textContent = `Stok Tersedia: ${selectedProduct.stok}`;
            document.getElementById('selectedQty').textContent = currentBuyQty;

            productModal.classList.remove('hidden');
        }

        function closeProductModal() {
            productModal.classList.add('hidden');
            selectedProduct = null;
        }

        function changeQty(amount) {
            if (!selectedProduct) return;
            let newQty = currentBuyQty + amount;
            if (newQty >= 1 && newQty <= selectedProduct.stok) {
                currentBuyQty = newQty;
                document.getElementById('selectedQty').textContent = currentBuyQty;
            } else if (newQty > selectedProduct.stok) {
                alert('Jumlah ngluwihi stok ingkang wonten!');
            }
        }

        document.getElementById('btnConfirmAddToCart').addEventListener('click', () => {
            if (!selectedProduct) return;

            const itemInCart = cart.find(c => c.id === selectedProduct.id);
            if (itemInCart) {
                if (itemInCart.qty + currentBuyQty <= selectedProduct.stok) {
                    itemInCart.qty += currentBuyQty;
                } else {
                    alert('Sumpah barang ing keranjang ngluwihi stok!');
                    return;
                }
            } else {
                cart.push({ ...selectedProduct, qty: currentBuyQty });
            }

            updateCartUI();
            closeProductModal();
        });

        function updateCartItemQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (!item) return;

            const productInStok = dataStok.find(s => s.id === id);
            let newQty = item.qty + change;

            if (newQty <= 0) {
                removeFromCart(id);
            } else if (productInStok && newQty <= productInStok.stok) {
                item.qty = newQty;
                updateCartUI();
            } else {
                alert('Jumlah ngluwihi stok!');
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = totalQty;

            const cartItemsList = document.getElementById('cartItemsList');
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<div style="text-align:center; color: var(--text-muted); font-size:0.8rem; padding: 10px;">Keranjang taksih kosong.</div>';
            } else {
                cartItemsList.innerHTML = cart.map(item => {
                    const subtotal = item.harga * item.qty;
                    totalPrice += subtotal;
                    return `
                        <div class="cart-item-row">
                            <div style="flex: 1;">
                                <b>${item.nama}</b><br>
                                <span style="color:var(--text-muted); font-size: 0.75rem;">Rp ${item.harga.toLocaleString('id-ID')} / pcs</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="btn-qty" style="width:24px; height:24px; font-size:0.8rem;" onclick="updateCartItemQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="btn-qty" style="width:24px; height:24px; font-size:0.8rem;" onclick="updateCartItemQty(${item.id}, 1)">+</button>
                            </div>
                            <div style="min-width: 80px; text-align: right; color: var(--accent-gold); font-weight: bold;">
                                Rp ${subtotal.toLocaleString('id-ID')}
                            </div>
                            <button class="btn-delete-item" onclick="removeFromCart(${item.id})" title="Hapus">🗑️</button>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('cartTotalPrice').textContent = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        document.getElementById('openCartBtn').addEventListener('click', () => cartModal.classList.remove('hidden'));
        document.getElementById('closeCartBtn').addEventListener('click', () => cartModal.classList.add('hidden'));

        document.getElementById('btnCheckout').addEventListener('click', () => {
            const name = document.getElementById('custName').value;
            const address = document.getElementById('custAddress').value;
            const method = document.getElementById('payMethod').value;

            if (cart.length === 0) {
                alert('Keranjang panjenengan taksih kosong!');
                return;
            }
            if (!name || !address) {
                alert('Nyuwun tulung isi nama lan alamat jangkep!');
                return;
            }

            cart.forEach(cartItem => {
                const itemInStok = dataStok.find(s => s.id === cartItem.id);
                if (itemInStok) {
                    itemInStok.stok -= cartItem.qty;
                }
            });
            localStorage.setItem('tp_stok', JSON.stringify(dataStok));

            const now = new Date();
            let dataPesanan = JSON.parse(localStorage.getItem('tp_pesanan')) || [];
            const newOrder = {
                id: Math.floor(1000 + Math.random() * 9000),
                tanggal: now.toLocaleDateString('id-ID'),
                waktu: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                nama: name,
                alamat: address,
                metode: method,
                items: cart.map(c => `${c.nama} (${c.qty})`).join(', '),
                total: cart.reduce((sum, item) => sum + (item.harga * item.qty), 0)
            };

            dataPesanan.push(newOrder);
            localStorage.setItem('tp_pesanan', JSON.stringify(dataPesanan));

            alert(`Matur nuwun ${name}, pesenan panjenengan sampun kasil dipun damel!`);
            
            cart = [];
            updateCartUI();
            document.getElementById('custAddress').value = '';
            cartModal.classList.add('hidden');
            
            renderProducts();
        });

        renderProducts();
    </script>
</body>
</html>
