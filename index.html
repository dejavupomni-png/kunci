<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Masuk - ElectroGlow ⚡</title>
    <style>
        :root {
            --bg-main: #06080f;
            --bg-card: rgba(18, 10, 25, 0.85);
            --bg-input: rgba(30, 15, 35, 0.9);
            --text-main: #fcfcfc;
            --text-muted: #a397ad;
            --neon-red: #ff2a5f;
            --neon-yellow: #ffcc00;
            --neon-cyan: #00f0ff;
            --border-color: rgba(255, 42, 95, 0.4);
            --border-yellow: rgba(255, 204, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 204, 0, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05), transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes thunderGlow {
            0% { text-shadow: 0 0 10px rgba(255, 204, 0, 0.4), 0 0 20px rgba(255, 42, 95, 0.2); }
            50% { text-shadow: 0 0 25px var(--neon-yellow), 0 0 35px var(--neon-red), 0 0 45px var(--neon-cyan); }
            100% { text-shadow: 0 0 10px rgba(255, 204, 0, 0.4), 0 0 20px rgba(255, 42, 95, 0.2); }
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        .portal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 95, 0.15);
            animation: cardFloat 6s ease-in-out infinite;
            position: relative;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-red), transparent, var(--neon-yellow));
            border-radius: 22px;
            z-index: -1;
            opacity: 0.3;
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: inline-block;
            filter: drop-shadow(0 0 10px var(--neon-yellow));
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-yellow);
            margin-bottom: 6px;
            animation: thunderGlow 3s infinite alternate;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .role-selection {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn-role {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-role:hover {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.25);
            background: rgba(45, 20, 50, 0.95);
        }

        .btn-admin-choice {
            background: linear-gradient(90deg, rgba(255, 42, 95, 0.15), rgba(255, 204, 0, 0.15));
            border-color: var(--border-yellow);
            color: var(--neon-yellow);
        }

        .btn-admin-choice:hover {
            border-color: var(--neon-red);
            color: var(--text-main);
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.35);
        }

        .badge-tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* MODAL LOGIN */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 4, 10, 0.88);
            z-index: 200;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input {
            width: 100%; padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.3);
            background: rgba(45, 20, 55, 1);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-red), #d68900);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-action:hover {
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.6);
            transform: translateY(-2px);
        }

        .btn-close {
            background: transparent; color: var(--text-muted);
            border: none; font-size: 1.3rem; cursor: pointer;
            transition: 0.2s;
        }
        .btn-close:hover { color: var(--neon-red); transform: rotate(90deg); }

        .hint-box {
            background: rgba(255, 204, 0, 0.08);
            border: 1px dashed var(--neon-yellow);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.78rem;
            color: var(--neon-yellow);
            margin-bottom: 16px;
            text-align: left;
            line-height: 1.4;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">ElectroGlow</div>
        <div class="brand-subtitle">Pusat Perangkat & Peralatan Elektronik Pintar Premium</div>

        <div class="role-selection">
            <button class="btn-role" onclick="openUserModal()">
                <span>🛍️ Masuk Pelanggan</span>
                <span class="badge-tag">User Mode</span>
            </button>
            <button class="btn-role btn-admin-choice" onclick="openAdminModal()">
                <span>🔒 Dashboard Admin</span>
                <span class="badge-tag" style="border-color: var(--neon-yellow);">Admin Mode</span>
            </button>
        </div>

        <p style="font-size: 0.78rem; color: var(--text-muted);">
            Sistem Keamanan Terintegrasi &bull; Silakan login sesuai peranan Anda.
        </p>
    </div>

    <div class="modal hidden" id="userModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">🛍️ Login Pelanggan</div>
                <button class="btn-close" onclick="closeModals()">✕</button>
            </div>
            
            <div class="hint-box">
                🔑 <b>Akses Pelanggan:</b><br>
                Username: <code style="color:#fff;">user</code> | Password: <code style="color:#fff;">user123</code>
            </div>

            <form onsubmit="loginUser(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="userUsername" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-action">Masuk Belanja ⚡</button>
            </form>
        </div>
    </div>

    <div class="modal hidden" id="adminModal">
        <div class="modal-card" style="border-color: var(--neon-yellow);">
            <div class="modal-header">
                <div class="modal-title" style="color: var(--neon-yellow);">🔒 Login Administrator</div>
                <button class="btn-close" onclick="closeModals()">✕</button>
            </div>

            <div class="hint-box" style="border-color: var(--neon-red); background: rgba(255, 42, 95, 0.08); color: var(--neon-red);">
                🔐 <b>Akses Pengelola:</b><br>
                Username: <code style="color:#fff;">admin</code> | Password: <code style="color:#fff;">admin123</code>
            </div>

            <form onsubmit="loginAdmin(event)">
                <div class="form-group">
                    <label>Username Admin</label>
                    <input type="text" id="adminUsername" placeholder="Masukkan username admin" required>
                </div>
                <div class="form-group">
                    <label>Password Admin</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-action" style="background: linear-gradient(90deg, #d68900, var(--neon-red));">Verifikasi & Masuk ⚡</button>
            </form>
        </div>
    </div>

    <script>
        function openUserModal() {
            closeModals();
            document.getElementById('userModal').classList.remove('hidden');
        }

        function openAdminModal() {
            closeModals();
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeModals() {
            document.getElementById('userModal').classList.add('hidden');
            document.getElementById('adminModal').classList.add('hidden');
        }

        // VERIFIKASI LOGIN USER (username: user | password: user123)
        function loginUser(event) {
            event.preventDefault();
            const u = document.getElementById('userUsername').value.trim();
            const p = document.getElementById('userPassword').value;

            if (u === 'user' && p === 'user123') {
                localStorage.setItem('tp_user_session', u);
                alert('⚡ Login Berhasil! Selamat datang di ElectroGlow.');
                // Mengarahkan ke file pelanggan (ganti jika nama file beda)
                window.location.href = 'pelanggan.html';
            } else {
                alert('❌ Username atau Password Pelanggan Salah!\n\nUsername: user\nPassword: user123');
            }
        }

        // VERIFIKASI LOGIN ADMIN (username: admin | password: admin123)
        function loginAdmin(event) {
            event.preventDefault();
            const u = document.getElementById('adminUsername').value.trim();
            const p = document.getElementById('adminPassword').value;

            if (u === 'admin' && p === 'admin123') {
                localStorage.setItem('tp_admin_session', 'true');
                alert('⚡ Login Administrator Berhasil!');
                window.location.href = 'admin.html';
            } else {
                alert('❌ Username atau Password Admin Salah!\n\nUsername: admin\nPassword: admin123');
            }
        }
    </script>
</body>
</html>
