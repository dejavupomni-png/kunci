 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ElectroGlow</title>
    <style>
        :root {
            --bg-main: #06080f;
            --bg-card: rgba(18, 10, 25, 0.85);
            --bg-input: rgba(30, 15, 35, 0.9);
            --text-main: #fcfcfc;
            --text-muted: #a397ad;
            --neon-red: #ff2a5f;
            --neon-yellow: #ffcc00;
            --neon-cyan: #00f0ff;
            --border-color: rgba(255, 42, 95, 0.4);
            --border-yellow: rgba(255, 204, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 95, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 204, 0, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05), transparent 60%);
            color: var(--text-main); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; 
            overflow: hidden;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        @keyframes thunderGlow {
            0% { text-shadow: 0 0 10px rgba(255, 204, 0, 0.4), 0 0 20px rgba(255, 42, 95, 0.2); }
            50% { text-shadow: 0 0 25px var(--neon-yellow), 0 0 35px var(--neon-red), 0 0 45px var(--neon-cyan); }
            100% { text-shadow: 0 0 10px rgba(255, 204, 0, 0.4), 0 0 20px rgba(255, 42, 95, 0.2); }
        }

        .login-card { 
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; 
            padding: 40px 30px; width: 100%; max-width: 420px; backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 95, 0.15); 
            animation: cardFloat 6s ease-in-out infinite;
        }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-icon { font-size: 2.5rem; margin-bottom: 8px; display: inline-block; filter: drop-shadow(0 0 10px var(--neon-yellow)); }
        .brand-title { font-size: 2rem; font-weight: 900; color: var(--neon-yellow); margin-bottom: 6px; animation: thunderGlow 3s infinite alternate; text-transform: uppercase; }
        .brand-desc { font-size: 0.85rem; color: var(--text-muted); }
        
        .role-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-tab { 
            flex: 1; padding: 12px; text-align: center; background: var(--bg-input); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; cursor: pointer; 
            font-size: 0.85rem; color: var(--text-muted); font-weight: bold; transition: 0.3s; 
        }
        .role-tab.active-pembeli { background: linear-gradient(90deg, rgba(255, 204, 0, 0.2), transparent); color: var(--neon-yellow); border-color: var(--neon-yellow); box-shadow: 0 0 15px rgba(255, 204, 0, 0.2); }
        .role-tab.active-admin { background: linear-gradient(90deg, rgba(255, 42, 95, 0.2), transparent); color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 15px rgba(255, 42, 95, 0.2); }

        .hint-box { border-radius: 8px; padding: 12px; font-size: 0.8rem; margin-bottom: 16px; text-align: left; }
        .hint-pembeli { background: rgba(255, 204, 0, 0.08); border: 1px dashed var(--neon-yellow); color: var(--neon-yellow); }
        .hint-admin { background: rgba(255, 42, 95, 0.08); border: 1px dashed var(--neon-red); color: var(--neon-red); }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--neon-yellow); margin-bottom: 6px; font-weight: bold; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255, 204, 0, 0.2); }

        .btn { width: 100%; color: #fff; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; margin-top: 10px; transition: 0.3s; text-transform: uppercase; }
        .btn-primary { background: linear-gradient(90deg, var(--neon-red), #d68900); }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(255, 42, 95, 0.6); transform: scale(1.02); }
        
        .btn-guest { background: transparent; border: 1px dashed var(--neon-cyan); color: var(--neon-cyan); margin-top: 12px; }
        .btn-guest:hover { background: rgba(0, 240, 255, 0.1); text-shadow: 0 0 5px var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

        .alert-box { padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-bottom: 16px; display: none; font-weight: bold; }
        .alert-error { background: rgba(255, 42, 95, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); }
        .alert-success { background: rgba(0, 240, 255, 0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); }

        .toggle-mode { font-size: 0.8rem; text-align: center; color: var(--text-muted); cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .toggle-mode:hover { color: var(--neon-yellow); text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">⚡</div>
            <div class="brand-title">ElectroGlow</div>
            <div class="brand-desc">Portal Akses Sistem Terpadu</div>
        </div>

        <div class="role-tabs">
            <div id="tabPembeli" class="role-tab active-pembeli" onclick="switchRole('pembeli')">🛍️ Pelanggan</div>
            <div id="tabAdmin" class="role-tab" onclick="switchRole('admin')">🔒 Admin</div>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- HINT BOXES -->
        <div id="hintPembeli" class="hint-box hint-pembeli">
            🔑 <b>Akses Pelanggan:</b><br>
            Username: <code style="color:#fff;">user</code> | Password: <code style="color:#fff;">user123</code>
        </div>
        <div id="hintAdmin" class="hint-box hint-admin hidden">
            🔐 <b>Akses Administrator:</b><br>
            Username: <code style="color:#fff;">admin</code> | Password: <code style="color:#fff;">admin123</code>
        </div>

        <form id="authForm" onsubmit="return false;">
            <div class="form-group">
                <label id="lblUsername">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="button" id="btnSubmit" class="btn btn-primary">Masuk Toko ⚡</button>
            
            <div id="pembeliActions">
                <button type="button" id="btnGuest" class="btn btn-guest">👤 Masuk Sebagai Tamu</button>
                <div class="toggle-mode" id="toggleReg">Atau daftar akun manual di sini</div>
            </div>
        </form>
    </div>

    <script>
        let currentRole = 'pembeli'; 
        let isRegisterMode = false;

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            box.textContent = msg;
            box.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function switchRole(role) {
            currentRole = role;
            isRegisterMode = false;
            hideAlert();

            const tabPembeli = document.getElementById('tabPembeli');
            const tabAdmin = document.getElementById('tabAdmin');
            
            // Reset tab styles
            tabPembeli.className = 'role-tab';
            tabAdmin.className = 'role-tab';

            if (role === 'pembeli') {
                tabPembeli.classList.add('active-pembeli');
                
                document.getElementById('hintPembeli').classList.remove('hidden');
                document.getElementById('hintAdmin').classList.add('hidden');
                document.getElementById('pembeliActions').classList.remove('hidden');
                
                document.getElementById('lblUsername').style.color = "var(--neon-yellow)";
                document.getElementById('btnSubmit').textContent = "Masuk Toko ⚡";
                document.getElementById('toggleReg').textContent = "Atau daftar akun manual di sini";
                document.getElementById('btnSubmit').style.background = "linear-gradient(90deg, var(--neon-red), #d68900)";
            } else {
                tabAdmin.classList.add('active-admin');
                
                document.getElementById('hintPembeli').classList.add('hidden');
                document.getElementById('hintAdmin').classList.remove('hidden');
                document.getElementById('pembeliActions').classList.add('hidden');
                
                document.getElementById('lblUsername').style.color = "var(--neon-red)";
                document.getElementById('btnSubmit').textContent = "Verifikasi & Masuk Admin 🔒";
                document.getElementById('btnSubmit').style.background = "linear-gradient(90deg, #990022, var(--neon-red))";
            }
        }

        document.getElementById('toggleReg').addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            hideAlert();
            if (isRegisterMode) {
                document.getElementById('hintPembeli').innerHTML = "📝 <b>Mode Registrasi:</b><br>Silakan buat Username & Password baru.";
                document.getElementById('btnSubmit').textContent = "Buat Akun Baru 🚀";
                document.getElementById('toggleReg').textContent = "Batal, kembali ke halaman login";
            } else {
                document.getElementById('hintPembeli').innerHTML = "🔑 <b>Akses Pelanggan:</b><br>Username: <code style='color:#fff;'>user</code> | Password: <code style='color:#fff;'>user123</code>";
                document.getElementById('btnSubmit').textContent = "Masuk Toko ⚡";
                document.getElementById('toggleReg').textContent = "Atau daftar akun manual di sini";
            }
        });

        document.getElementById('btnSubmit').addEventListener('click', () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                showAlert("Mohon isi username dan password!");
                return;
            }

            if (currentRole === 'admin') {
                if (user === ADMIN_USER && pass === ADMIN_PASS) {
                    localStorage.setItem('tp_admin_session', 'true');
                    window.location.href = 'admin.html';
                } else {
                    showAlert("❌ Username atau Password Admin Salah!");
                }
            } else {
                let userList = JSON.parse(localStorage.getItem('tp_users')) || [];

                if (isRegisterMode) {
                    const exist = userList.find(u => u.username.toLowerCase() === user.toLowerCase());
                    if (exist) {
                        showAlert("❌ Username sudah terdaftar! Gunakan username lain.");
                        return;
                    }

                    userList.push({ username: user, password: pass });
                    localStorage.setItem('tp_users', JSON.stringify(userList));
                    localStorage.setItem('tp_user_session', user);
                    
                    showAlert("✅ Akun berhasil dibuat! Dialihkan...", true);
                    setTimeout(() => window.location.href = 'pembeli.html', 1000);
                } else {
                    const foundUser = userList.find(u => u.username.toLowerCase() === user.toLowerCase());
                    
                    if (foundUser) {
                        if (foundUser.password === pass) {
                            localStorage.setItem('tp_user_session', foundUser.username);
                            window.location.href = 'pembeli.html';
                        } else {
                            showAlert("❌ Password salah untuk username ini!");
                        }
                    } else {
                        // OTOMATIS DAFTAR & LOGIN jika username belum pernah ada
                        userList.push({ username: user, password: pass });
                        localStorage.setItem('tp_users', JSON.stringify(userList));
                        localStorage.setItem('tp_user_session', user);
                        
                        showAlert("⚡ Akun otomatis dibuat! Dialihkan...", true);
                        setTimeout(() => window.location.href = 'pembeli.html', 800);
                    }
                }
            }
        });

        document.getElementById('btnGuest').addEventListener('click', () => {
            localStorage.setItem('tp_user_session', 'Tamu / Guest');
            window.location.href = 'pembeli.html';
        });
    </script>
</body>
</html>
