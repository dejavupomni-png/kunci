<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Elektronik Premium</title>
    <style>
        :root {
            --bg-main: #080000;
            --bg-card: rgba(30, 5, 5, 0.7);
            --bg-input: rgba(45, 10, 10, 0.8);
            --text-main: #fcfcfc;
            --text-muted: #d4c5b9;
            --neon-red: #ff2a2a;
            --neon-yellow: #ffcc00;
            --border-color: rgba(255, 42, 42, 0.4);
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            background-image: radial-gradient(circle at top right, #3a0000, transparent 40%),
                              radial-gradient(circle at bottom left, #221500, transparent 40%);
            color: var(--text-main); 
            padding-bottom: 60px; 
            min-height: 100vh;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px rgba(255, 42, 42, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); border-color: var(--neon-yellow); }
            100% { box-shadow: 0 0 10px rgba(255, 42, 42, 0.2); }
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg-card); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .logo { font-size: 1.2rem; font-weight: bold; color: var(--neon-yellow); text-decoration: none; text-shadow: 0 0 8px rgba(255, 204, 0, 0.5); }
        
        .user-nav { display: flex; align-items: center; gap: 8px; }
        .user-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-input); padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); }
        .btn-logout { background: transparent; border: 1px dashed var(--neon-red); color: var(--neon-red); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: rgba(255, 42, 42, 0.1); text-shadow: 0 0 5px var(--neon-red); }

        .cart-btn {
            background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.3s;
        }
        .cart-btn:hover { border-color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .cart-badge { background: linear-gradient(90deg, var(--neon-red), var(--neon-yellow)); color: #000; font-weight: bold; padding: 2px 6px; border-radius: 10px; font-size: 0.75rem; }

        .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

        .hero-banner {
            background: linear-gradient(135deg, #4a0000, #000000, #4d3800); 
            border-radius: 12px; padding: 24px;
            margin-bottom: 20px; text-align: center; border: 1px solid var(--border-color);
            animation: neonPulse 4s infinite;
        }
        .hero-banner h2 { font-size: 1.3rem; margin-bottom: 6px; color: var(--neon-yellow); text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .hero-banner p { font-size: 0.85rem; color: var(--text-muted); }

        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
        .cat-chip {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 8px 16px; border-radius: 16px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(8px);
        }
        .cat-chip:hover { border-color: var(--neon-yellow); color: var(--text-main); }
        .cat-chip.active { 
            background: linear-gradient(90deg, rgba(255, 42, 42, 0.2), rgba(255, 204, 0, 0.2)); 
            color: var(--neon-yellow); font-weight: bold; border-color: var(--neon-yellow); 
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
        }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
            backdrop-filter: blur(8px); transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--neon-yellow); box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(255, 204, 0, 0.2); }
        
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; background: var(--bg-input); margin-bottom: 10px; }
        .product-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; line-height: 1.2; color: var(--text-main); }
        .product-cat { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .product-price { color: var(--neon-yellow); font-weight: bold; font-size: 1rem; margin-bottom: 12px; text-shadow: 0 0 5px rgba(255, 204, 0, 0.3); }
        
        .btn-add { 
            background: linear-gradient(90deg, var(--neon-red), #d68900); 
            color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; 
            font-size: 0.85rem; cursor: pointer; width: 100%; transition: 0.3s; text-transform: uppercase;
        }
        .btn-add:hover { box-shadow: 0 0 12px rgba(255, 42, 42, 0.6); transform: scale(1.02); }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(8px); }
        .modal-card { background: var(--bg-card); border: 1px solid var(--neon-red); border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 30px rgba(255, 42, 42, 0.2); }
        .hidden { display: none !important; }

        /* Styling YouTube Thumbnail */
        .youtube-preview-container { 
            display: block; position: relative; width: 100%; cursor: pointer; 
            margin-bottom: 12px; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color); text-decoration: none;
        }
        .preview-img { width: 100%; height: 200px; object-fit: cover; background: #000; display: block; transition: 0.3s; opacity: 0.8; }
        .youtube-preview-container:hover .preview-img { opacity: 1; transform: scale(1.05); }
        .youtube-play-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 3.5rem; color: var(--neon-red); text-shadow: 0 0 15px var(--neon-yellow); 
            opacity: 0.9; transition: 0.3s;
        }
        .youtube-preview-container:hover .youtube-play-btn { transform: translate(-50%, -50%) scale(1.1); text-shadow: 0 0 25px var(--neon-yellow); }

        .qty-control { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; }
        .btn-qty { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--neon-yellow); width: 36px; height: 36px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .btn-qty:hover { border-color: var(--neon-yellow); background: rgba(255, 204, 0, 0.1); }
        .qty-value { font-size: 1.1rem; font-weight: bold; min-width: 30px; text-align: center; color: var(--text-main); }

        .cart-item-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .btn-delete-item { background: transparent; border: none; color: var(--neon-red); cursor: pointer; font-size: 1.2rem; padding: 2px 6px; transition: 0.2s; }
        .btn-delete-item:hover { text-shadow: 0 0 8px var(--neon-red); transform: scale(1.1); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--neon-yellow); margin-bottom: 6px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255, 204, 0, 0.3); }

        .btn-close { background: transparent; color: var(--text-muted); border: none; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .btn-close:hover { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
        .btn-cancel { background: transparent; border: 1px dashed var(--border-color); color: var(--text-muted); padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .btn-cancel:hover { color: var(--text-main); border-color: var(--text-main); box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <script>
        let activeUser = localStorage.getItem('tp_user_session');
        if (!activeUser) {
            activeUser = "Tamu / Guest"; 
        }
    </script>

    <header>
        <a href="#" class="logo">⚡ ElectroGlow</a>
        
        <div class="user-nav">
            <span class="user-tag" id="userDisplay">👤 Guest</span>
            <button class="cart-btn" id="openCartBtn">
                🛒 <span class="cart-badge" id="cartCount">0</span>
            </button>
            <button class="btn-logout" id="btnLogoutUser">Keluar</button>
        </div>
    </header>

    <div class="container">
        <div class="hero-banner">
            <h2>Pusat Elektronik Pintar & Premium</h2>
            <p>Smart TV, Audio, Kamera, dan Perangkat Rumah Tangga Terkini.</p>
        </div>

        <div class="category-scroll" id="catFilter">
            <button class="cat-chip active" onclick="filterCategory('ALL', this)">Semua Produk</button>
            <button class="cat-chip" onclick="filterCategory('TV', this)">Smart TV</button>
            <button class="cat-chip" onclick="filterCategory('Audio', this)">Audio & Speaker</button>
            <button class="cat-chip" onclick="filterCategory('Kamera', this)">Kamera</button>
            <button class="cat-chip" onclick="filterCategory('Gaming', this)">Gaming Console</button>
            <button class="cat-chip" onclick="filterCategory('Peralatan', this)">Peralatan Rumah</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="modal hidden" id="productModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                <h3 style="font-size: 1.1rem; color: var(--neon-yellow);" id="modalProdTitle">Detail Elektronik</h3>
                <button class="btn-close" onclick="closeProductModal()">✕</button>
            </div>

            <a id="modalYoutubeLink" href="#" target="_blank" rel="noopener noreferrer" class="youtube-preview-container" title="Tonton Review di YouTube">
                <img id="modalYoutubeThumb" src="" alt="Thumbnail Video Review" class="preview-img">
                <div class="youtube-play-btn">▶</div>
            </a>
            
            <div style="margin-bottom: 12px; text-align: center;">
                <div id="modalProdCat" style="font-size: 0.8rem; color: var(--text-muted);">Kategori</div>
                <div id="modalProdPrice" style="font-size: 1.3rem; color: var(--neon-yellow); font-weight: bold; margin-top: 4px; text-shadow: 0 0 5px rgba(255,204,0,0.4);">Rp 0</div>
                <div id="modalProdStock" style="font-size: 0.85rem; color: var(--text-main); margin-top: 6px;">Stok Tersedia: 0</div>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; text-align: center;">Tentukan Jumlah:</label>
                <div class="qty-control">
                    <button class="btn-qty" onclick="changeQty(-1)">-</button>
                    <span class="qty-value" id="selectedQty">1</span>
                    <button class="btn-qty" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn-cancel" onclick="closeProductModal()">Batal</button>
                <button class="btn-add" id="btnConfirmAddToCart" style="padding: 12px;">+ Masukkan Keranjang</button>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="cartModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                <h3 style="font-size: 1.1rem; color: var(--neon-yellow);">Keranjang Belanja</h3>
                <button class="btn-close" id="closeCartBtn">✕</button>
            </div>

            <div id="cartItemsList" style="margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; max-height: 35vh; overflow-y: auto;"></div>

            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1rem; margin-bottom: 16px; padding: 10px; background: var(--bg-input); border-radius: 6px;">
                <span>Total Estimasi:</span>
                <span id="cartTotalPrice" style="color: var(--neon-yellow); text-shadow: 0 0 5px rgba(255,204,0,0.5);">Rp 0</span>
            </div>

            <form id="checkoutForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Nama Penerima</label>
                    <input type="text" id="custName" placeholder="Masukkan nama penerima" required>
                </div>
                <div class="form-group">
                    <label>Alamat Lengkap</label>
                    <textarea id="custAddress" rows="2" placeholder="Detail alamat pengiriman..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select id="payMethod">
                        <option value="COD">COD (Bayar di Tempat)</option>
                        <option value="OVO">OVO (Dompet Digital)</option>
                        <option value="Transfer Bank">Transfer Bank Virtual Account</option>
                        <option value="QRIS">QRIS / E-Wallet Lainnya</option>
                        <option value="Kartu Kredit">Kartu Kredit / Cicilan</option>
                    </select>
                </div>
                <button type="button" id="btnCheckout" class="btn-add" style="padding: 12px; margin-top: 10px;">Proses Pembayaran</button>
            </form>
        </div>
    </div>

    <script>
        function playAddToCartSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = audioCtx.sampleRate * 1; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; 
                }

                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1500, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                noiseSource.start();
            } catch (e) {
                console.log("Audio didukung setelah interaksi pengguna.");
            }
        }

        // DATABASE PRODUK DENGAN LINK YOUTUBE BARU
        const defaultElektronik = [
            { id: 1, nama: "Smart TV 4K UHD 55 Inch", kategori: "TV", harga: 5500000, stok: 10, gambar: "https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=500&auto=format&fit=crop", video: "https://youtu.be/b3pRJie7OIs?si=RqYNmoJGLgJ4U8Ji" },
            { id: 2, nama: "Soundbar Home Theater 5.1", kategori: "Audio", harga: 2300000, stok: 15, gambar: "https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500&auto=format&fit=crop", video: "https://youtu.be/wS_2YvDqELY?si=_mHWouWJ9dHVS6py" },
            { id: 3, nama: "Konsol Game Next-Gen", kategori: "Gaming", harga: 8500000, stok: 5, gambar: "https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=500&auto=format&fit=crop", video: "https://youtu.be/RceFViYOjdU?si=ZZGLQxm4CAm5MsSi" },
            { id: 4, nama: "Kamera Mirrorless Pro", kategori: "Kamera", harga: 12000000, stok: 8, gambar: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500&auto=format&fit=crop", video: "https://youtu.be/cXuw_dljE-I?si=6dSzqGQ21-Llnwjg" },
            { id: 5, nama: "Smart Refrigerator (Kulkas Pintar)", kategori: "Peralatan", harga: 9500000, stok: 4, gambar: "https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=500&auto=format&fit=crop", video: "https://youtu.be/ha7HlEW0kyc?si=WHJXq5PCW5SqBsH4" },
            { id: 6, nama: "Headphone Bluetooth NC", kategori: "Audio", harga: 1450000, stok: 25, gambar: "https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=500&auto=format&fit=crop", video: "https://youtu.be/MIYwPwIwfqU?si=fH8oFbQVF0J3158p" }
        ];

        // MENGGUNAKAN KEY BARU "v6" AGAR TIDAK BENTROK DENGAN DATA LAMA
        let dataStok = JSON.parse(localStorage.getItem('tp_stok_elek_v6'));
        if (!dataStok || dataStok.length === 0) {
            dataStok = defaultElektronik;
            localStorage.setItem('tp_stok_elek_v6', JSON.stringify(dataStok));
        }

        let cart = [];
        let selectedProduct = null;
        let currentBuyQty = 1;

        document.getElementById('userDisplay').textContent = `👤 ${activeUser}`;
        if (activeUser !== 'Tamu / Guest') {
            document.getElementById('custName').value = activeUser;
        }

        document.getElementById('btnLogoutUser').addEventListener('click', () => {
            localStorage.removeItem('tp_user_session');
            window.location.href = 'index.html';
        });

        const productGrid = document.getElementById('productGrid');
        const cartModal = document.getElementById('cartModal');
        const productModal = document.getElementById('productModal');

        function renderProducts(filter = 'ALL') {
            dataStok = JSON.parse(localStorage.getItem('tp_stok_elek_v6')) || [];
            
            let filteredData = dataStok;
            if (filter !== 'ALL') {
                filteredData = dataStok.filter(p => p.kategori.toLowerCase().includes(filter.toLowerCase()));
            }

            if (filteredData.length === 0) {
                productGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 20px;">Belum ada produk untuk kategori ini.</div>';
                return;
            }

            productGrid.innerHTML = filteredData.map(p => `
                <div class="product-card">
                    <div>
                        <img src="${p.gambar}" class="product-img" alt="${p.nama}">
                        <div class="product-title">${p.nama}</div>
                        <div class="product-cat">${p.kategori} | Stok: ${p.stok}</div>
                    </div>
                    <div>
                        <div class="product-price">Rp ${p.harga.toLocaleString('id-ID')}</div>
                        <button class="btn-add" onclick="openProductModal(${p.id})">+ Keranjang</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderProducts(cat);
        }

        // FUNGSI UNTUK MENGAMBIL ID VIDEO DARI BERBAGAI FORMAT LINK YOUTUBE
        function getYouTubeID(url) {
            if(!url) return null;
            // Regex ini mampu menangkap format link "youtu.be" dengan parameter "?si="
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function openProductModal(id) {
            selectedProduct = dataStok.find(p => p.id === id);
            if (!selectedProduct || selectedProduct.stok <= 0) {
                alert('Stok barang sedang kosong!');
                return;
            }

            currentBuyQty = 1;
            document.getElementById('modalProdTitle').textContent = selectedProduct.nama;
            
            // PROSES LOGIKA THUMBNAIL YOUTUBE
            const ytID = getYouTubeID(selectedProduct.video);
            const ytLinkElem = document.getElementById('modalYoutubeLink');
            const ytThumbElem = document.getElementById('modalYoutubeThumb');
            
            if (ytID) {
                ytLinkElem.href = selectedProduct.video; 
                ytThumbElem.src = `https://img.youtube.com/vi/${ytID}/hqdefault.jpg`; 
                ytLinkElem.style.display = 'block';
            } else {
                ytLinkElem.style.display = 'none'; 
            }

            document.getElementById('modalProdCat').textContent = `Kategori: ${selectedProduct.kategori}`;
            document.getElementById('modalProdPrice').textContent = `Rp ${selectedProduct.harga.toLocaleString('id-ID')}`;
            document.getElementById('modalProdStock').textContent = `Stok Tersedia: ${selectedProduct.stok}`;
            document.getElementById('selectedQty').textContent = currentBuyQty;

            productModal.classList.remove('hidden');
        }

        function closeProductModal() {
            productModal.classList.add('hidden');
            selectedProduct = null;
        }

        function changeQty(amount) {
            if (!selectedProduct) return;
            let newQty = currentBuyQty + amount;
            if (newQty >= 1 && newQty <= selectedProduct.stok) {
                currentBuyQty = newQty;
                document.getElementById('selectedQty').textContent = currentBuyQty;
            } else if (newQty > selectedProduct.stok) {
                alert('Jumlah melebihi stok yang tersedia!');
            }
        }

        document.getElementById('btnConfirmAddToCart').addEventListener('click', () => {
            if (!selectedProduct) return;

            const itemInCart = cart.find(c => c.id === selectedProduct.id);
            if (itemInCart) {
                if (itemInCart.qty + currentBuyQty <= selectedProduct.stok) {
                    itemInCart.qty += currentBuyQty;
                } else {
                    alert('Total barang di keranjang melebihi stok yang tersedia!');
                    return;
                }
            } else {
                cart.push({ ...selectedProduct, qty: currentBuyQty });
            }

            playAddToCartSound();
            updateCartUI();
            closeProductModal();
        });

        function updateCartItemQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (!item) return;

            const productInStok = dataStok.find(s => s.id === id);
            let newQty = item.qty + change;

            if (newQty <= 0) {
                removeFromCart(id);
            } else if (productInStok && newQty <= productInStok.stok) {
                item.qty = newQty;
                updateCartUI();
            } else {
                alert('Jumlah melebihi stok yang tersedia!');
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = totalQty;

            const cartItemsList = document.getElementById('cartItemsList');
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<div style="text-align:center; color: var(--text-muted); font-size:0.85rem; padding: 20px;">Keranjang masih kosong. Mari berbelanja!</div>';
            } else {
                cartItemsList.innerHTML = cart.map(item => {
                    const subtotal = item.harga * item.qty;
                    totalPrice += subtotal;
                    return `
                        <div class="cart-item-row">
                            <div style="flex: 1; padding-right: 10px;">
                                <b style="color: var(--text-main);">${item.nama}</b><br>
                                <span style="color:var(--text-muted); font-size: 0.75rem;">Rp ${item.harga.toLocaleString('id-ID')} / unit</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="btn-qty" style="width:28px; height:28px; font-size:0.9rem;" onclick="updateCartItemQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="btn-qty" style="width:28px; height:28px; font-size:0.9rem;" onclick="updateCartItemQty(${item.id}, 1)">+</button>
                            </div>
                            <div style="min-width: 90px; text-align: right; color: var(--neon-yellow); font-weight: bold;">
                                Rp ${subtotal.toLocaleString('id-ID')}
                            </div>
                            <button class="btn-delete-item" onclick="removeFromCart(${item.id})" title="Hapus">✕</button>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('cartTotalPrice').textContent = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        document.getElementById('openCartBtn').addEventListener('click', () => cartModal.classList.remove('hidden'));
        document.getElementById('closeCartBtn').addEventListener('click', () => cartModal.classList.add('hidden'));

        document.getElementById('btnCheckout').addEventListener('click', () => {
            const name = document.getElementById('custName').value;
            const address = document.getElementById('custAddress').value;
            const method = document.getElementById('payMethod').value;

            if (cart.length === 0) {
                alert('Keranjang Anda kosong!');
                return;
            }
            if (!name || !address) {
                alert('Mohon isi nama dan alamat pengiriman dengan lengkap!');
                return;
            }

            cart.forEach(cartItem => {
                const itemInStok = dataStok.find(s => s.id === cartItem.id);
                if (itemInStok) {
                    itemInStok.stok -= cartItem.qty;
                }
            });
            localStorage.setItem('tp_stok_elek_v6', JSON.stringify(dataStok));

            alert(`Pesanan via ${method} berhasil dibuat! Terima kasih ${name}, pesanan Anda sedang diproses.`);
            
            cart = [];
            updateCartUI();
            document.getElementById('custAddress').value = '';
            cartModal.classList.add('hidden');
            
            renderProducts();
        });

        renderProducts();
    </script>
</body>
</html>
