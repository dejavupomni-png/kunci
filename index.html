<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index - Toko Online Batik</title>
    <style>
        :root {
            /* Tema Merah & Hitam */
            --bg-main: #0a0000;
            --bg-card: rgba(15, 5, 5, 0.85); /* Transparan gelap */
            --bg-input: rgba(30, 5, 5, 0.6);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #ef4444; /* Merah menyala */
            --accent-dark: #b91c1c; /* Merah gelap */
            --border: #7f1d1d; /* Border merah gelap */
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            /* Ganti URL di bawah ini dengan nama file gambar Megamendung Anda, misal: url('megamendung.jpg') */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(40, 0, 0, 0.85)), url('https://img.freepik.com/premium-vector/megamendung-batik-pattern-background_69260-843.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 16px; 
        }

        .login-card { 
            background: var(--bg-card); 
            backdrop-filter: blur(8px); /* Efek blur kaca */
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border); 
            border-top: 4px solid var(--accent); /* Garis atas merah */
            border-radius: 12px; 
            padding: 28px 24px; 
            width: 100%; 
            max-width: 380px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(239, 68, 68, 0.2); 
        }
        
        .role-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .role-tab { flex: 1; padding: 10px; text-align: center; background: var(--bg-input); border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); font-weight: bold; transition: 0.3s; }
        .role-tab:hover { background: rgba(239, 68, 68, 0.1); }
        .role-tab.active { background: var(--accent-dark); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

        .login-header { text-align: center; margin-bottom: 20px; }
        .login-header h2 { font-size: 1.3rem; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .login-header p { font-size: 0.85rem; color: var(--text-muted); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }

        .btn { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 10px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: linear-gradient(135deg, #f87171, var(--accent)); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .btn:active { transform: scale(0.98); }
        
        .btn-guest { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); margin-top: 12px; }
        .btn-guest:hover { color: var(--accent); border-color: var(--accent); background: rgba(239, 68, 68, 0.05); box-shadow: none; }

        .alert-box { padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-bottom: 15px; display: none; font-weight: bold; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
        .alert-success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: #86efac; }

        .toggle-mode { font-size: 0.8rem; text-align: center; color: var(--text-muted); cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .toggle-mode:hover { color: var(--accent); text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="role-tabs">
            <div class="role-tab active" onclick="switchRole('pembeli')">🛒 Pembeli</div>
            <div class="role-tab" onclick="switchRole('admin')">🔒 Admin</div>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- HEADER PEMBELI -->
        <div id="pembeliHeader" class="login-header">
            <h2 id="pembeliTitle">Portal Pembeli</h2>
            <p>Silakan isi username & password Anda</p>
        </div>

        <!-- HEADER ADMIN -->
        <div id="adminHeader" class="login-header hidden">
            <h2>Panel Admin</h2>
            <p>Akses khusus pengelola toko</p>
        </div>

        <form id="authForm" onsubmit="return false;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="button" id="btnSubmit" class="btn">Masuk Toko</button>
            
            <div id="pembeliActions">
                <button type="button" id="btnGuest" class="btn btn-guest">Masuk Sebagai Tamu</button>
                <div class="toggle-mode" id="toggleReg">Atau daftar manual di sini</div>
            </div>
        </form>
    </div>

    <script>
        let currentRole = 'pembeli'; // 'pembeli' atau 'admin'
        let isRegisterMode = false;

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            box.textContent = msg;
            box.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function switchRole(role) {
            currentRole = role;
            isRegisterMode = false;
            hideAlert();

            document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
            if (role === 'pembeli') {
                document.querySelectorAll('.role-tab')[0].classList.add('active');
                document.getElementById('pembeliHeader').classList.remove('hidden');
                document.getElementById('adminHeader').classList.add('hidden');
                document.getElementById('pembeliActions').classList.remove('hidden');
                document.getElementById('pembeliTitle').textContent = "Portal Pembeli";
                document.getElementById('btnSubmit').textContent = "Masuk Toko";
                document.getElementById('toggleReg').textContent = "Atau daftar manual di sini";
            } else {
                document.querySelectorAll('.role-tab')[1].classList.add('active');
                document.getElementById('pembeliHeader').classList.add('hidden');
                document.getElementById('adminHeader').classList.remove('hidden');
                document.getElementById('pembeliActions').classList.add('hidden');
                document.getElementById('btnSubmit').textContent = "Masuk Panel Admin";
            }
        }

        document.getElementById('toggleReg').addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            hideAlert();
            if (isRegisterMode) {
                document.getElementById('pembeliTitle').textContent = "Pendaftaran Baru";
                document.getElementById('btnSubmit').textContent = "Buat Akun";
                document.getElementById('toggleReg').textContent = "Sudah punya akun? Login di sini";
            } else {
                document.getElementById('pembeliTitle').textContent = "Portal Pembeli";
                document.getElementById('btnSubmit').textContent = "Masuk Toko";
                document.getElementById('toggleReg').textContent = "Atau daftar manual di sini";
            }
        });

        document.getElementById('btnSubmit').addEventListener('click', () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                showAlert("Mohon isi username dan password!");
                return;
            }

            if (currentRole === 'admin') {
                if (user === ADMIN_USER && pass === ADMIN_PASS) {
                    localStorage.setItem('tp_admin_session', 'true');
                    window.location.href = 'admin.html';
                } else {
                    showAlert("Username/Password Admin Salah!");
                }
            } else {
                let userList = JSON.parse(localStorage.getItem('tp_users')) || [];

                if (isRegisterMode) {
                    const exist = userList.find(u => u.username.toLowerCase() === user.toLowerCase());
                    if (exist) {
                        showAlert("Username sudah terdaftar! Gunakan username lain.");
                        return;
                    }

                    userList.push({ username: user, password: pass });
                    localStorage.setItem('tp_users', JSON.stringify(userList));
                    localStorage.setItem('tp_user_session', user);
                    
                    showAlert("Akun berhasil dibuat! Dialihkan...", true);
                    setTimeout(() => window.location.href = 'pembeli.html', 1000);
                } else {
                    const foundUser = userList.find(u => u.username.toLowerCase() === user.toLowerCase());
                    
                    if (foundUser) {
                        // Jika akun sudah ada di LocalStorage, cocokkan password-nya
                        if (foundUser.password === pass) {
                            localStorage.setItem('tp_user_session', foundUser.username);
                            window.location.href = 'pembeli.html';
                        } else {
                            showAlert("Password salah untuk username ini!");
                        }
                    } else {
                        // OTOMATIS DAFTAR & LOGIN jika username belum pernah ada
                        userList.push({ username: user, password: pass });
                        localStorage.setItem('tp_users', JSON.stringify(userList));
                        localStorage.setItem('tp_user_session', user);
                        
                        showAlert("Akun baru berhasil dibuat! Dialihkan...", true);
                        setTimeout(() => window.location.href = 'pembeli.html', 800);
                    }
                }
            }
        });

        document.getElementById('btnGuest').addEventListener('click', () => {
            localStorage.setItem('tp_user_session', 'Tamu / Guest');
            window.location.href = 'pembeli.html';
        });
    </script>
</body>
</html>
